esphome:
  name: espscaldabagno
  friendly_name: ESP Scaldabagno

esp32:
  board: esp32dev
  framework:
    type: arduino

# AI Thinker ESP32-CAM / OV2640
# Stability is more useful than maximum frame rate for this project.
psram:
  mode: quad
  speed: 40MHz

i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27
    scan: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 5min

  ap:
    ssid: "Scaldabagno Fallback"
    password: !secret fallback_password

captive_portal:

logger:
  level: WARN

api:
  encryption:
    key: !secret api_encryption_key
  max_connections: 2
  listen_backlog: 2
  reboot_timeout: 5min

ota:
  - platform: esphome
    password: !secret ota_password

# On-board flash LED. The Docker service controls this through Home Assistant.
output:
  - platform: ledc
    pin: GPIO4
    id: flash_pwm_scaldabagno
    frequency: 5000 Hz

light:
  - platform: monochromatic
    id: flash_scaldabagno
    name: "Scaldabagno - Flash"
    output: flash_pwm_scaldabagno
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

sensor:
  - platform: wifi_signal
    name: "Scaldabagno - WiFi"
    update_interval: 60s

  - platform: uptime
    name: "Scaldabagno - Uptime"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Scaldabagno - Stato"

switch:
  - platform: restart
    name: "Scaldabagno - Restart"

esp32_camera:
  name: "Scaldabagno - Camera"
  id: scaldabagno_cam

  external_clock:
    pin: GPIO0
    frequency: 20MHz

  i2c_id: camera_i2c

  data_pins:
    - GPIO5
    - GPIO18
    - GPIO19
    - GPIO21
    - GPIO36
    - GPIO39
    - GPIO34
    - GPIO35

  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

  resolution: 800x600
  jpeg_quality: 12
  pixel_format: jpeg
  frame_buffer_count: 1
  frame_buffer_location: PSRAM

  # This is a still-image sensor, not a video stream.
  max_framerate: 1 fps
  idle_framerate: 0.1 fps

  vertical_flip: false
  horizontal_mirror: false
  brightness: 0
  contrast: 1
  saturation: 0
  aec2: true
  wb_mode: auto
